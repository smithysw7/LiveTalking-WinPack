###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
batch_size: 16

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: edgetts                  # edgetts(默认,流畅) / qwen3tts(本地离线) / gpt-sovits / omnitts / tencent / doubao / azuretts / qwentts
REF_FILE: zh-CN-YunxiaNeural   # edgetts 音色名；切换 qwen3tts 时改为 Vivian/Serena/Uncle_Fu 等
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash

# -------- LLM ----------------------------------------------------------
llm_provider: localllm         # localllm(内置本地大模型) / dashscope / deepseek / zhipu / custom / orcarouter
llm_model: ''                  # model override, empty = provider default
llm_system_prompt: ''          # 数字人人设提示词，留空使用默认

# -------- Local LLM (llama.cpp) ---------------------------------------
llm_port: 8765                 # 本地大模型服务端口
llm_ctx_size: 8192             # 上下文长度

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
